        <!-- Schermata d'ingresso dell'app: visibile subito, prima che il codice sia caricato -->
        <style>
            #app-splash { display: none; position: fixed; inset: 0; z-index: 2147483647; background: #2FA4C7;
                align-items: center; justify-content: center; transition: opacity .4s ease; }
            html.app-standalone, html.app-standalone body { background: #2FA4C7; }
            html.app-standalone #app-splash { display: flex; }
            #app-splash img { width: 30vmin; height: 30vmin; border-radius: 50%; transition: transform .4s ease; }
            #app-splash.pulse img { animation: app-splash-pulse .6s ease-in-out; }
            #app-splash.exit { opacity: 0; }
            #app-splash.exit img { transform: scale(1.25); }
            @keyframes app-splash-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
            @media (prefers-reduced-motion: reduce) { #app-splash.pulse img { animation: none; } #app-splash img { transition: none; } }
        </style>
        <script>
            // Solo quando il pannello è aperto come app installata (o con ?splash=1 per le prove)
            (function () {
                var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
                var force = /[?&]splash=1/.test(location.search);
                if ((standalone && location.pathname.indexOf("/admin") === 0) || force) {
                    document.documentElement.classList.add("app-standalone");
                }
            })();
        </script>
